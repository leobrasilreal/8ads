<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultoria Gratuita | 8ads</title>
    <meta name="description" content="Solicite sua consultoria gratuita com a 8ads." />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <header class="site-header"><div class="container nav-wrap"><a href="index.html" class="logo"><span>8</span>ads</a></div></header>
    <main class="section">
      <div class="container form-wrap">
        <h1>Consultoria Gratuita</h1>
        <p>Preencha o formulário e nossa equipe retorna com próximos passos e link de agendamento.</p>
        <p><a class="btn btn-outline" href="https://calendly.com" target="_blank" rel="noopener">Agendar via Calendly</a></p>
        <form class="lead-form" id="lead-form">
          <label>Nome completo<input required name="nome" /></label>
          <label>Email<input required type="email" name="email" /></label>
          <label>Telefone/WhatsApp<input required name="telefone" /></label>
          <label>Empresa<input required name="empresa" /></label>
          <label>Setor/Nicho<input required name="setor" /></label>
          <label>Orçamento mensal em tráfego pago<select name="orcamento"><option>Até R$ 3.000</option><option>R$ 3.000 a R$ 10.000</option><option>R$ 10.000+</option></select></label>
          <label>Plataforma principal<select name="plataforma"><option>Google Ads</option><option>Meta Ads</option><option>LinkedIn Ads</option></select></label>
          <label>Mensagem (opcional)<textarea name="mensagem" rows="4"></textarea></label>
          <button class="btn btn-primary" type="submit">Enviar Solicitação</button>
          <p id="form-response" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>
  </body>
</html>
